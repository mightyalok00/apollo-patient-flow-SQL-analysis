<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Figtree', 'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007c9d" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58320" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002d39" />
      <stop offset="100%" stop-color="#007c9d" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002d39" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background & Border -->
  <rect width="780" height="400" fill="#ffffff" rx="8"/>
  <rect x="0.5" y="0.5" width="779" height="399" fill="none" stroke="#d7e7eb" stroke-width="1" rx="8"/>

  <!-- Chart Header -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#002d39">Q03: Top 5 Busiest Departments</text>
    <text x="0" y="18" font-size="11" fill="#527983">Highest volume clinical specialties across all network facilities</text>
  </g>

  <!-- Chart Graphics Content -->
  <g transform="translate(40, 80)">
        <g transform="translate(0, 0)">
          <text x="210" y="16" font-size="11.5" font-weight="600" fill="#002d39" text-anchor="end">Apollo Hyderabad Orthopedics</text>
          <line x1="225" y1="12" x2="626" y2="12" stroke="#f58320" stroke-width="3" stroke-linecap="round"/>
          <circle cx="626" cy="12" r="9" fill="#f58320"/>
          <text x="626" y="16" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">137</text>
          <text x="646" y="16" font-size="10" font-weight="600" fill="#527983">admissions</text>
        </g>
        
        <g transform="translate(0, 48)">
          <text x="210" y="16" font-size="11.5" font-weight="600" fill="#002d39" text-anchor="end">Apollo Hyderabad General Medicine</text>
          <line x1="225" y1="12" x2="621" y2="12" stroke="#007c9d" stroke-width="3" stroke-linecap="round"/>
          <circle cx="621" cy="12" r="9" fill="#007c9d"/>
          <text x="621" y="16" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">135</text>
          <text x="641" y="16" font-size="10" font-weight="600" fill="#527983">admissions</text>
        </g>
        
        <g transform="translate(0, 96)">
          <text x="210" y="16" font-size="11.5" font-weight="600" fill="#002d39" text-anchor="end">Apollo Delhi General Medicine</text>
          <line x1="225" y1="12" x2="618" y2="12" stroke="#007c9d" stroke-width="3" stroke-linecap="round"/>
          <circle cx="618" cy="12" r="9" fill="#007c9d"/>
          <text x="618" y="16" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">134</text>
          <text x="638" y="16" font-size="10" font-weight="600" fill="#527983">admissions</text>
        </g>
        
        <g transform="translate(0, 144)">
          <text x="210" y="16" font-size="11.5" font-weight="600" fill="#002d39" text-anchor="end">Apollo Delhi Orthopedics</text>
          <line x1="225" y1="12" x2="606" y2="12" stroke="#007c9d" stroke-width="3" stroke-linecap="round"/>
          <circle cx="606" cy="12" r="9" fill="#007c9d"/>
          <text x="606" y="16" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">130</text>
          <text x="626" y="16" font-size="10" font-weight="600" fill="#527983">admissions</text>
        </g>
        
        <g transform="translate(0, 192)">
          <text x="210" y="16" font-size="11.5" font-weight="600" fill="#002d39" text-anchor="end">Apollo Mumbai Cardiology</text>
          <line x1="225" y1="12" x2="603" y2="12" stroke="#007c9d" stroke-width="3" stroke-linecap="round"/>
          <circle cx="603" cy="12" r="9" fill="#007c9d"/>
          <text x="603" y="16" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">129</text>
          <text x="623" y="16" font-size="10" font-weight="600" fill="#527983">admissions</text>
        </g>
        </g>

  <!-- Apollo Analytical Footer Watermark -->
  <g transform="translate(30, 384)">
    <line x1="0" y1="-10" x2="720" y2="-10" stroke="#d7e7eb" stroke-width="0.75" />
    <text x="0" y="0" font-size="9" fill="#527983" font-style="italic">
      Network-wide analytical snapshot | Dataset: 4 Hospitals, 2,500 Admissions, 7,300 Bed Logs | Apollo Portfolio Project
    </text>
  </g>
</svg>