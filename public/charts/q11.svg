<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Figtree', 'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007c9d" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58320" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002d39" />
      <stop offset="100%" stop-color="#007c9d" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002d39" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background & Border -->
  <rect width="780" height="400" fill="#ffffff" rx="8"/>
  <rect x="0.5" y="0.5" width="779" height="399" fill="none" stroke="#d7e7eb" stroke-width="1" rx="8"/>

  <!-- Chart Header -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#002d39">Q11: Waiting Time Deviation Above Network Baseline</text>
    <text x="0" y="18" font-size="11" fill="#527983">Diverging delta chart measuring department latency variance against the 62.81-minute global mean</text>
  </g>

  <!-- Chart Graphics Content -->
  
    <g transform="translate(40, 80)">
      <!-- Baseline Axis -->
      <line x1="420" y1="0" x2="420" y2="240" stroke="#002d39" stroke-width="2"/>
      <text x="420" y="-8" font-size="10" font-weight="700" fill="#002d39" text-anchor="middle">Baseline: 62.81m</text>
    
        <g transform="translate(0, 10)">
          <text x="210" y="14" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Bangalore Emergency</text>
          <rect x="420" y="2" width="263" height="16" fill="#e11d48" rx="2"/>
          <text x="691" y="14" font-size="10" font-weight="700" fill="#e11d48" text-anchor="start">+43.9m</text>
        </g>
        
        <g transform="translate(0, 38)">
          <text x="210" y="14" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Mumbai Emergency</text>
          <rect x="420" y="2" width="237" height="16" fill="#e11d48" rx="2"/>
          <text x="665" y="14" font-size="10" font-weight="700" fill="#e11d48" text-anchor="start">+39.5m</text>
        </g>
        
        <g transform="translate(0, 66)">
          <text x="210" y="14" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Delhi Emergency</text>
          <rect x="420" y="2" width="228" height="16" fill="#e11d48" rx="2"/>
          <text x="656" y="14" font-size="10" font-weight="700" fill="#e11d48" text-anchor="start">+38.1m</text>
        </g>
        
        <g transform="translate(0, 94)">
          <text x="210" y="14" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Hyderabad Emergency</text>
          <rect x="420" y="2" width="220" height="16" fill="#e11d48" rx="2"/>
          <text x="648" y="14" font-size="10" font-weight="700" fill="#e11d48" text-anchor="start">+36.8m</text>
        </g>
        
        <g transform="translate(0, 122)">
          <text x="210" y="14" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Delhi Cardiology</text>
          <rect x="346" y="2" width="74" height="16" fill="#10b981" rx="2"/>
          <text x="338" y="14" font-size="10" font-weight="700" fill="#10b981" text-anchor="end">-12.4m</text>
        </g>
        
        <g transform="translate(0, 150)">
          <text x="210" y="14" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Mumbai Orthopedics</text>
          <rect x="311" y="2" width="109" height="16" fill="#10b981" rx="2"/>
          <text x="303" y="14" font-size="10" font-weight="700" fill="#10b981" text-anchor="end">-18.2m</text>
        </g>
        
        <g transform="translate(0, 178)">
          <text x="210" y="14" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Hyderabad General Med</text>
          <rect x="273" y="2" width="147" height="16" fill="#10b981" rx="2"/>
          <text x="265" y="14" font-size="10" font-weight="700" fill="#10b981" text-anchor="end">-24.5m</text>
        </g>
        
        <g transform="translate(0, 206)">
          <text x="210" y="14" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Bangalore Neurology</text>
          <rect x="233" y="2" width="187" height="16" fill="#10b981" rx="2"/>
          <text x="225" y="14" font-size="10" font-weight="700" fill="#10b981" text-anchor="end">-31.2m</text>
        </g>
        </g>

  <!-- Apollo Analytical Footer Watermark -->
  <g transform="translate(30, 384)">
    <line x1="0" y1="-10" x2="720" y2="-10" stroke="#d7e7eb" stroke-width="0.75" />
    <text x="0" y="0" font-size="9" fill="#527983" font-style="italic">
      Network-wide analytical snapshot | Dataset: 4 Hospitals, 2,500 Admissions, 7,300 Bed Logs | Apollo Portfolio Project
    </text>
  </g>
</svg>