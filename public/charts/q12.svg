<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Figtree', 'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007c9d" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58320" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002d39" />
      <stop offset="100%" stop-color="#007c9d" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002d39" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background & Border -->
  <rect width="780" height="400" fill="#ffffff" rx="8"/>
  <rect x="0.5" y="0.5" width="779" height="399" fill="none" stroke="#d7e7eb" stroke-width="1" rx="8"/>

  <!-- Chart Header -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#002d39">Q12: Operational Attention Quadrant Matrix</text>
    <text x="0" y="18" font-size="11" fill="#527983">Multi-variable quadrant plotting patient volume, triage latency, and readmission severity</text>
  </g>

  <!-- Chart Graphics Content -->
  
    <g transform="translate(60, 60)">
      <!-- Quadrants -->
      <rect x="60" y="20" width="280" height="120" fill="#fff8e6" opacity="0.4"/>
      <rect x="340" y="20" width="280" height="120" fill="#fee2e2" opacity="0.5"/>
      <rect x="60" y="140" width="280" height="120" fill="#e3f8ec" opacity="0.4"/>
      <rect x="340" y="140" width="280" height="120" fill="#def4fa" opacity="0.4"/>

      <!-- Crosshairs -->
      <line x1="340" y1="20" x2="340" y2="260" stroke="#d7e7eb" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="60" y1="140" x2="620" y2="140" stroke="#d7e7eb" stroke-width="1.5" stroke-dasharray="4,4"/>

      <text x="345" y="32" font-size="9.5" font-weight="700" fill="#e11d48">CRITICAL ATTENTION (High Vol + High Wait)</text>
      <text x="70" y="250" font-size="9.5" font-weight="700" fill="#10b981">OPTIMAL EFFICIENCY (Low Vol + Low Wait)</text>

      <!-- Bubbles -->
      <!-- Emergencies (High Wait, Moderate Volume) -->
      <circle cx="280" cy="50" r="18" fill="#e11d48" opacity="0.85"/>
      <text x="280" y="54" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">BLR Emg</text>

      <circle cx="320" cy="58" r="18" fill="#e11d48" opacity="0.85"/>
      <text x="320" y="62" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">MUM Emg</text>

      <circle cx="310" cy="65" r="17" fill="#e11d48" opacity="0.85"/>
      <text x="310" y="69" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">DEL Emg</text>

      <!-- Orthopedics (High Volume, Low Wait) -->
      <circle cx="560" cy="200" r="16" fill="#007c9d" opacity="0.85"/>
      <text x="560" y="204" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">HYD Ortho</text>

      <!-- General Medicine (High Volume, Moderate Wait) -->
      <circle cx="530" cy="180" r="15" fill="#007c9d" opacity="0.85"/>
      <text x="530" y="184" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">DEL Med</text>

      <!-- Axis labels -->
      <text x="340" y="285" font-size="10" font-weight="600" fill="#002d39" text-anchor="middle">Patient Admission Volume →</text>
      <text x="30" y="140" font-size="10" font-weight="600" fill="#002d39" text-anchor="middle" transform="rotate(-90 30 140)">Wait Time (mins) →</text>
    </g>
    

  <!-- Apollo Analytical Footer Watermark -->
  <g transform="translate(30, 384)">
    <line x1="0" y1="-10" x2="720" y2="-10" stroke="#d7e7eb" stroke-width="0.75" />
    <text x="0" y="0" font-size="9" fill="#527983" font-style="italic">
      Network-wide analytical snapshot | Dataset: 4 Hospitals, 2,500 Admissions, 7,300 Bed Logs | Apollo Portfolio Project
    </text>
  </g>
</svg>