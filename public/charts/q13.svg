<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Figtree', 'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007c9d" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58320" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002d39" />
      <stop offset="100%" stop-color="#007c9d" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002d39" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background & Border -->
  <rect width="780" height="400" fill="#ffffff" rx="8"/>
  <rect x="0.5" y="0.5" width="779" height="399" fill="none" stroke="#d7e7eb" stroke-width="1" rx="8"/>

  <!-- Chart Header -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#002d39">Q13: Multi-Metric Rank Shift Trajectory</text>
    <text x="0" y="18" font-size="11" fill="#527983">Bump chart tracking operational rank transitions across volume, latency, and composite bottleneck severity</text>
  </g>

  <!-- Chart Graphics Content -->
  
    <g transform="translate(60, 75)">
      <!-- Columns -->
      <text x="140" y="10" font-size="11" font-weight="700" fill="#002d39" text-anchor="middle">Volume Rank</text>
      <text x="340" y="10" font-size="11" font-weight="700" fill="#002d39" text-anchor="middle">Wait Time Rank</text>
      <text x="540" y="10" font-size="11" font-weight="700" fill="#002d39" text-anchor="middle">Bottleneck Rank</text>

      <!-- Lines & Points -->
      <!-- Bangalore Emergency: Vol #12 -> Wait #1 -> Bottleneck #1 -->
      <path d="M 140 180 C 240 180, 240 40, 340 40 C 440 40, 440 40, 540 40" fill="none" stroke="#e11d48" stroke-width="4"/>
      <circle cx="140" cy="180" r="7" fill="#e11d48"/><text x="140" y="184" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">12</text>
      <circle cx="340" cy="40" r="7" fill="#e11d48"/><text x="340" y="44" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <circle cx="540" cy="40" r="7" fill="#e11d48"/><text x="540" y="44" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="560" y="44" font-size="10.5" font-weight="700" fill="#e11d48">BLR Emergency (#1 Strain)</text>

      <!-- Mumbai Emergency: Vol #10 -> Wait #2 -> Bottleneck #2 -->
      <path d="M 140 150 C 240 150, 240 70, 340 70 C 440 70, 440 70, 540 70" fill="none" stroke="#f58320" stroke-width="3"/>
      <circle cx="140" cy="150" r="6" fill="#f58320"/>
      <circle cx="340" cy="70" r="6" fill="#f58320"/>
      <circle cx="540" cy="70" r="6" fill="#f58320"/>
      <text x="560" y="74" font-size="10.5" font-weight="600" fill="#f58320">MUM Emergency (#2)</text>

      <!-- Hyderabad Ortho: Vol #1 -> Wait #16 -> Bottleneck #14 -->
      <path d="M 140 40 C 240 40, 240 200, 340 200 C 440 200, 440 180, 540 180" fill="none" stroke="#007c9d" stroke-width="3"/>
      <circle cx="140" cy="40" r="6" fill="#007c9d"/><text x="140" y="44" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <circle cx="340" cy="200" r="6" fill="#007c9d"/>
      <circle cx="540" cy="180" r="6" fill="#007c9d"/>
      <text x="560" y="184" font-size="10.5" font-weight="600" fill="#007c9d">HYD Ortho (High Vol / Low Wait)</text>
    </g>
    

  <!-- Apollo Analytical Footer Watermark -->
  <g transform="translate(30, 384)">
    <line x1="0" y1="-10" x2="720" y2="-10" stroke="#d7e7eb" stroke-width="0.75" />
    <text x="0" y="0" font-size="9" fill="#527983" font-style="italic">
      Network-wide analytical snapshot | Dataset: 4 Hospitals, 2,500 Admissions, 7,300 Bed Logs | Apollo Portfolio Project
    </text>
  </g>
</svg>