        <g transform="translate(0, 157)">
          <text x="175" y="16" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Apollo Hyderabad Emergency</text>
          <g transform="translate(190, 2)">
            <rect x="0" y="0" width="99.00000000000001" height="20" fill="#e11d48"/>
            <rect x="99.00000000000001" y="0" width="92.4" height="20" fill="#f58320"/>
            <rect x="191.40000000000003" y="0" width="96.80000000000001" height="20" fill="#007c9d"/>
            <rect x="288.20000000000005" y="0" width="97.68" height="20" fill="#002d39"/>
          </g>
          <text x="645" y="16" font-size="12" font-weight="800" fill="#e11d48">87.7</text>
        </g>
        
        <g transform="translate(0, 201)">
          <text x="175" y="16" font-size="10.5" font-weight="600" fill="#002d39" text-anchor="end">Apollo Delhi Cardiology</text>
          <g transform="translate(190, 2)">
            <rect x="0" y="0" width="52.800000000000004" height="20" fill="#e11d48"/>
            <rect x="52.800000000000004" y="0" width="72.60000000000001" height="20" fill="#f58320"/>
            <rect x="125.4" y="0" width="66.88" height="20" fill="#007c9d"/>
            <rect x="192.28" y="0" width="77.0" height="20" fill="#002d39"/>
          </g>
          <text x="645" y="16" font-size="12" font-weight="800" fill="#007c9d">61.2</text>
        </g>
        </g>

  <!-- Apollo Analytical Footer Watermark -->
  <g transform="translate(30, 384)">
    <line x1="0" y1="-10" x2="720" y2="-10" stroke="#d7e7eb" stroke-width="0.75" />
    <text x="0" y="0" font-size="9" fill="#527983" font-style="italic">
      Network-wide analytical snapshot | Dataset: 4 Hospitals, 2,500 Admissions, 7,300 Bed Logs | Apollo Portfolio Project
    </text>
