            <rect x="0" y="0" width="104.72000000000001" height="20" fill="#e11d48"/>
            <rect x="104.72000000000001" y="0" width="99.00000000000001" height="20" fill="#f58320"/>
            <rect x="203.72000000000003" y="0" width="103.4" height="20" fill="#007c9d"/>
            <rect x="307.12" y="0" width="100.32000000000001" height="20" fill="#002d39"/>
          </g>
